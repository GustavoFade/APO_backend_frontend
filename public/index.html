<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Clientes</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="cabecalho">
        <h1>Gestão de Clientes</h1>
        <p class="cabecalho__subtitulo">Cadastre, edite e exclua clientes em um só lugar.</p>
    </header>

    <main class="conteudo">
        <div id="mensagens" class="mensagens" role="status" aria-live="polite"></div>

        <div class="grade-principal">
            <section class="painel" aria-labelledby="titulo-formulario">
                <h2 id="titulo-formulario">Formulário</h2>
                <form id="form-cliente" class="formulario" novalidate>
                    <input type="hidden" id="cliente-id" name="id" value="">
                    <div class="campo">
                        <label for="nome">Nome <span class="obrigatorio" aria-hidden="true">*</span></label>
                        <input type="text" id="nome" name="nome" required autocomplete="name" placeholder="Nome completo">
                    </div>
                    <div class="campo">
                        <label for="email">E-mail <span class="obrigatorio" aria-hidden="true">*</span></label>
                        <input type="email" id="email" name="email" required autocomplete="email" placeholder="seu@email.com">
                    </div>
                    <div class="campo">
                        <label for="telefone">Telefone</label>
                        <input type="tel" id="telefone" name="telefone" autocomplete="tel" placeholder="(00) 00000-0000">
                    </div>
                    <div class="formulario__acoes">
                        <button type="submit" id="btn-salvar" class="botao botao--primario">Cadastrar</button>
                        <button type="button" id="btn-cancelar" class="botao botao--secundario" hidden>Cancelar edição</button>
                    </div>
                </form>
            </section>

            <section class="painel" aria-labelledby="titulo-lista">
                <h2 id="titulo-lista">Clientes cadastrados</h2>
                <p id="lista-carregando" class="carregando" hidden>Carregando clientes…</p>
                <div id="area-lista" class="lista"></div>
            </section>
        </div>
    </main>

    <footer class="rodape">
        <p>APO – Back-end e Front-end</p>
    </footer>

    <script type="module" src="js/app.js"></script>
</body>
</html>
